<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Cream rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="88" ry="88" fill="#F5F0E8" filter="url(#shadow)"/>

  <!-- Cute decorative sparkles -->
  <g fill="#E8D5B0" opacity="0.7">
    <circle cx="88" cy="96" r="6"/>
    <circle cx="424" cy="88" r="5"/>
    <circle cx="96" cy="420" r="5"/>
    <circle cx="416" cy="410" r="7"/>
    <circle cx="140" cy="72" r="3"/>
    <circle cx="380" cy="428" r="4"/>
  </g>

  <!-- "lwl" cute 2D characters - hand-drawn style with rounded strokes -->
  <g fill="#2C2C2C" stroke="#2C2C2C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter l -->
    <line x1="130" y1="130" x2="130" y2="380"/>
    <path d="M130 140 Q200 130 200 200" fill="none"/>

    <!-- Letter w -->
    <polyline points="220,380 250,200 275,310 300,200 330,380" fill="none"/>

    <!-- Letter l -->
    <line x1="370" y1="130" x2="370" y2="380"/>
    <path d="M370 140 Q440 130 440 200" fill="none"/>
  </g>

  <!-- Cute face dots (eyes + blush on the l's) -->
  <g fill="#2C2C2C">
    <!-- Left l cute face -->
    <circle cx="118" cy="250" r="6"/>
    <circle cx="148" cy="250" r="6"/>
    <!-- Right l cute face -->
    <circle cx="358" cy="250" r="6"/>
    <circle cx="388" cy="250" r="6"/>
  </g>
  <!-- Blush -->
  <g fill="#F0B0B0" opacity="0.5">
    <ellipse cx="105" cy="265" rx="14" ry="7"/>
    <ellipse cx="161" cy="265" rx="14" ry="7"/>
    <ellipse cx="345" cy="265" rx="14" ry="7"/>
    <ellipse cx="401" cy="265" rx="14" ry="7"/>
  </g>

  <!-- Bottom dots decoration -->
  <g fill="#D4C8B0" opacity="0.5">
    <circle cx="220" cy="440" r="4"/>
    <circle cx="256" cy="445" r="5"/>
    <circle cx="292" cy="440" r="4"/>
  </g>
</svg>
